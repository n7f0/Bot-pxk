version: '3.8'
services:
  discord-bot:
    build: .
    container_name: pxk-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
    volumes:
      - ./data:/app/data

  painel:
    build: .
    container_name: pxk-painel
    restart: unless-stopped
    command: ["python", "-u", "panel.py"]
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - PANEL_SECRET=${PANEL_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
