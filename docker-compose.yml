version: '3.8'
services:
  pxk-sistema:
    build: .
    container_name: pxk-sistema
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    network_mode: "host"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}