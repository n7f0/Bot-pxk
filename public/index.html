<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PXK - Painel de Controle Total</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap');
        :root { --purple: #8A4FFF; --purple-hi: #A370FF; --bg: rgba(15, 12, 20, 0.85); --border: rgba(255,255,255,0.08); --input-bg: rgba(0,0,0,0.5); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at 10% 20%, rgba(138,79,255,0.2) 0%, transparent 40%), #050308; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 16px 40px; background: rgba(10,8,15,0.8); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; z-index: 10; }
        .header img { width: 40px; height: 40px; border-radius: 8px; }
        .header h1 { font-family: 'Archivo Black'; font-size: 20px; text-transform: uppercase; }
        .header .logout { margin-left: auto; color: #f87171; text-decoration: none; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 8px; background: rgba(248,113,113,0.1); transition: 0.2s; }
        .header .logout:hover { background: #f87171; color: #fff; }

        .container { display: flex; flex: 1; padding: 24px; gap: 24px; max-width: 1600px; margin: 0 auto; width: 100%; overflow: hidden; }
        .sidebar { width: 290px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 20px; overflow-y: auto; flex-shrink: 0; }
        .nav-btn { display: block; width: 100%; padding: 10px 16px; margin-bottom: 4px; background: transparent; color: #B8B8C2; border: 1px solid transparent; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-btn.active { background: rgba(138,79,255,0.15); color: #fff; border-color: var(--purple); }
        
        .content { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        
        h2 { font-family: 'Archivo Black'; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
        h3 { font-size: 13px; color: var(--purple-hi); margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media(max-width: 1200px) { .grid { grid-template-columns: 1fr 1fr; } }
        @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 11px; font-weight: 800; color: #B8B8C2; text-transform: uppercase; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(138,79,255,0.2); }
        select[multiple] { height: 100px; }
        textarea { resize: vertical; min-height: 80px; }
        .tutorial { background: rgba(138,79,255,0.1); border-left: 3px solid var(--purple); padding: 12px 16px; border-radius: 6px; font-size: 12px; color: #B8B8C2; margin-top: 8px; display: flex; gap: 10px; line-height: 1.5; }
        
        .save-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0a0810; padding: 12px 24px; border-radius: 99px; border: 1px solid var(--purple); display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); z-index: 100; }
        .btn-save { background: var(--purple); color: #fff; border: none; padding: 12px 32px; border-radius: 99px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-save:hover { background: var(--purple-hi); transform: scale(1.05); }
        .loading { text-align: center; color: var(--purple); font-weight: bold; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>

        const getVal = (obj, path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
        
        function setVal(obj, path, value) {
            const keys = path.split('.');
            let curr = obj;
            for (let i = 0; i < keys.length - 1; i++) {
                if (!curr[keys[i]]) curr[keys[i]] = {};
                curr = curr[keys[i]];
            }
            curr[keys[keys.length - 1]] = value;
        }

        function construirPainel() {
            const sidebar = document.getElementById('sidebar');
            const form = document.getElementById('mainForm');
            sidebar.innerHTML = '';
            form.innerHTML = '';
            let isFirst = true;

            for (const [tabId, tabData] of Object.entries(SCHEMA)) {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${isFirst ? 'active' : ''}`;
                btn.innerHTML = `${tabData.icon} ${tabData.name}`;
                btn.onclick = (e) => mudarAba(tabId, e.target);
                sidebar.appendChild(btn);

                const tabDiv = document.createElement('div');
                tabDiv.id = `tab-${tabId}`;
                tabDiv.className = `tab-content ${isFirst ? 'active' : ''}`;
                tabDiv.innerHTML = `<h2>${tabData.name}</h2>`;
                isFirst = false;

                tabData.groups.forEach(group => {
                    tabDiv.innerHTML += `<h3>${group.title}</h3><div class="grid" id="grid-${tabId}-${group.title.replace(/\s/g, '')}"></div>`;
                    const grid = tabDiv.querySelector(`#grid-${tabId}-${group.title.replace(/\s/g, '')}`);

                    group.fields.forEach(field => {
                        const wrapper = document.createElement('div');
                        wrapper.className = ['textarea', 'text', 'discord_ch', 'discord_cat', 'discord_vc'].includes(field.type) ? 'full' : '';
                        
                        let inputHtml = `<label>${field.label}</label>`;
                        const fieldId = field.key.replace(/\./g, '_');
                        
                        if (field.type === 'text') inputHtml += `<input type="text" id="${fieldId}" data-key="${field.key}" placeholder="Digite...">`;
                        else if (field.type === 'number') inputHtml += `<input type="number" id="${fieldId}" data-key="${field.key}">`;
                        else if (field.type === 'color') inputHtml += `<input type="color" id="${fieldId}" data-key="${field.key}">`;
                        else if (field.type === 'textarea') inputHtml += `<textarea id="${fieldId}" data-key="${field.key}"></textarea>`;
                        else if (field.type === 'select') {
                            inputHtml += `<select id="${fieldId}" data-key="${field.key}">`;
                            field.options.forEach(o => inputHtml += `<option value="${o.v}">${o.l}</option>`);
                            inputHtml += `</select>`;
                        }
                        else if (field.type.startsWith('discord_')) {
                            const isMulti = field.type.includes('multi');
                            const typeMap = { discord_ch: 'ch', discord_ch_multi: 'ch', discord_cat: 'cat', discord_vc: 'vc', discord_role_multi: 'role' };
                            const dataType = typeMap[field.type];
                            inputHtml += `<select id="${fieldId}" data-key="${field.key}" class="discord-data" data-type="${dataType}" ${isMulti ? 'multiple' : ''}></select>`;
                        }

                        if(field.help) inputHtml += `<div class="tutorial">💡 ${field.help}</div>`;

                        wrapper.innerHTML = inputHtml;
                        grid.appendChild(wrapper);
                    });
                });
                form.appendChild(tabDiv);
            }
        }

        async function carregarDados() {
            const res = await fetch('/api/config');
            globalConfig = await res.json();
            
            discordData = await fetch('/api/discord-data').then(r => r.json());

            document.querySelectorAll('.discord-data').forEach(sel => {
                const type = sel.dataset.type;
                const list = discordData[type] || [];
                sel.innerHTML = list.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
            });

            document.querySelectorAll('[data-key]').forEach(input => {
                const key = input.dataset.key;
                let val = getVal(globalConfig, key);
                
                if (val === undefined || val === null) {
                    if (input.type === 'checkbox') val = false;
                    else if (input.tagName === 'SELECT' && !input.multiple) val = '';
                    else return;
                }

                if (input.multiple && Array.isArray(val)) {
                    Array.from(input.options).forEach(opt => opt.selected = val.includes(opt.value));
                } else if (input.type === 'checkbox') {
                    input.checked = Boolean(val);
                } else {
                    input.value = val;
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainForm').style.display = 'block';
            document.getElementById('saveBar').style.display = 'flex';
        }

        async function salvarTudo(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-save');
            btn.innerText = 'Salvando...';

            const updatedData = JSON.parse(JSON.stringify(globalConfig));

            const multiSelects = {};
            document.querySelectorAll('select[multiple]').forEach(sel => {
                const key = sel.dataset.key;
                multiSelects[key] = Array.from(sel.selectedOptions).map(o => o.value);
            });

            document.querySelectorAll('[data-key]').forEach(input => {
                const key = input.dataset.key;
                let val;

                if (input.multiple) {
                    val = multiSelects[key];
                } else {
                    val = input.value;
                    if (input.type === 'number') val = Number(val);
                    if (val === 'true') val = true;
                    if (val === 'false') val = false;
                }
                
                setVal(updatedData, key, val);
            });

            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (res.ok) {
                globalConfig = updatedData;
                btn.innerText = 'Salvo com Sucesso!';
                btn.style.background = '#2ecc71';
                setTimeout(() => { btn.innerText = 'Salvar Tudo'; btn.style.background = '#8A4FFF'; }, 2000);
            }
        }

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            btn.classList.add('active');
        }

        construirPainel();
        carregarDados();
    </script>
