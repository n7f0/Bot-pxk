<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PXK - Painel de Controle Total</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap');
        :root { --purple: #8A4FFF; --purple-hi: #A370FF; --bg: rgba(15, 12, 20, 0.85); --border: rgba(255,255,255,0.08); --input-bg: rgba(0,0,0,0.5); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at 10% 20%, rgba(138,79,255,0.2) 0%, transparent 40%), #050308; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { padding: 16px 40px; background: rgba(10,8,15,0.8); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; z-index: 10; }
        .header img { width: 40px; height: 40px; border-radius: 8px; }
        .header h1 { font-family: 'Archivo Black'; font-size: 20px; text-transform: uppercase; }
        .header .logout { margin-left: auto; color: #f87171; text-decoration: none; font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 8px; background: rgba(248,113,113,0.1); transition: 0.2s; }
        .header .logout:hover { background: #f87171; color: #fff; }

        .container { display: flex; flex: 1; padding: 24px; gap: 24px; max-width: 1600px; margin: 0 auto; width: 100%; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 20px; overflow-y: auto; flex-shrink: 0; }
        .nav-btn { display: block; width: 100%; padding: 12px 20px; margin-bottom: 6px; background: transparent; color: #B8B8C2; border: 1px solid transparent; border-radius: 10px; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-btn.active { background: rgba(138,79,255,0.15); color: #fff; border-color: var(--purple); }
        
        .content { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        
        h2 { font-family: 'Archivo Black'; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
        h3 { font-size: 13px; color: var(--purple-hi); margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        @media(max-width: 1200px) { .grid { grid-template-columns: 1fr 1fr; } }
        @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 11px; font-weight: 800; color: #B8B8C2; text-transform: uppercase; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(138,79,255,0.2); }
        select[multiple] { height: 100px; }
        textarea { resize: vertical; min-height: 80px; }
        
        .save-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0a0810; padding: 12px 24px; border-radius: 99px; border: 1px solid var(--purple); display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); z-index: 100; }
        .btn-save { background: var(--purple); color: #fff; border: none; padding: 12px 32px; border-radius: 99px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-save:hover { background: var(--purple-hi); transform: scale(1.05); }
        .loading { text-align: center; color: var(--purple); font-weight: bold; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="/logo.gif" onerror="this.style.display='none'">
        <h1>PXK SYSTEM</h1>
        <a href="/logout" class="logout">Sair da Conta</a>
    </header>

    <div class="container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content">
            <div id="loading" class="loading">⏳ Lendo o Banco de Dados MongoDB...</div>
            <form id="mainForm" onsubmit="salvarTudo(event)" style="display: none;"></form>
        </main>
    </div>

    <div class="save-bar" id="saveBar" style="display: none;">
        <span style="color: #7A7A88; font-size: 12px;">Alterações salvas direto no MongoDB.</span>
        <button type="submit" form="mainForm" class="btn-save">Salvar Tudo</button>
    </div>

    <script>
        let globalConfig = {};
        let discordData = { ch: [], vc: [], cat: [], role: [] };

        // =========================================================================
        // O MAPA COMPLETO DO BOT (Tudo que existe no db.js e db(1).js mapeado aqui)
        // =========================================================================
        const SCHEMA = {
            identidade: {
                icon: '🎨', name: 'Identidade Visual',
                groups: [
                    { title: 'Aparência Global', fields: [
                        { key: 'tickets.panel.title', label: 'Título do Painel (Tickets)', type: 'text' },
                        { key: 'tickets.panel.desc1', label: 'Descrição Principal', type: 'textarea' },
                        { key: 'tickets.panel.color', label: 'Cor do Painel (Hex)', type: 'color' },
                        { key: 'tickets.panel.banner', label: 'URL do Banner', type: 'text' },
                    ]}
                ]
            },
            servidores: {
                icon: '🌐', name: 'Servidores',
                groups: [
                    { title: 'IDs Principais', fields: [
                        { key: 'servers.mainId', label: 'ID do Servidor Principal', type: 'text' },
                        { key: 'servers.internalId', label: 'ID do Servidor Interno (Staff)', type: 'text' },
                    ]}
                ]
            },
            canais: {
                icon: '📡', name: 'Canais e Logs',
                groups: [
                    { title: 'Logs do Servidor Principal', fields: [
                        { key: 'logs.main.geral', label: 'Log Geral', type: 'discord_ch' },
                        { key: 'logs.main.tickets', label: 'Log de Tickets', type: 'discord_ch' },
                        { key: 'logs.main.recrutamento', label: 'Log de Recrutamento', type: 'discord_ch' },
                    ]},
                    { title: 'Logs do Servidor Interno', fields: [
                        { key: 'logs.internal.geral', label: 'Log Geral (Interno)', type: 'discord_ch' },
                        { key: 'logs.internal.plantao', label: 'Log de Plantão', type: 'discord_ch' },
                        { key: 'logs.internal.admin', label: 'Log Administrativo', type: 'discord_ch' },
                    ]},
                    { title: 'Canais do MOV Call', fields: [
                        { key: 'movCall.panelChannelId', label: 'Canal do Painel MOV', type: 'discord_ch' },
                        { key: 'listaMov.channelId', label: 'Canal da Lista de MOV', type: 'discord_ch' },
                        { key: 'voice.channelIds', label: 'Calls Válidas (Horas Gerais)', type: 'discord_vc_multi' },
                        { key: 'voice.categoryIds', label: 'Categorias Válidas (Horas Gerais)', type: 'discord_cat_multi' },
                    ]}
                ]
            },
            permissoes: {
                icon: '🔐', name: 'Permissões e Cargos',
                groups: [
                    { title: 'Servidor Principal', fields: [
                        { key: 'perms.main.admin', label: 'Cargos Admin', type: 'discord_role_multi' },
                        { key: 'perms.main.leader', label: 'Cargos Liderança', type: 'discord_role_multi' },
                        { key: 'perms.main.recruiter', label: 'Cargos Recrutador', type: 'discord_role_multi' },
                        { key: 'perms.main.migrator', label: 'Cargos Migração', type: 'discord_role_multi' },
                    ]},
                    { title: 'Servidor Interno', fields: [
                        { key: 'perms.internal.admin', label: 'Cargos Admin (Interno)', type: 'discord_role_multi' },
                        { key: 'perms.internal.leader', label: 'Cargos Liderança (Interno)', type: 'discord_role_multi' },
                        { key: 'perms.internal.shift', label: 'Quem inicia Plantão', type: 'discord_role_multi' },
                    ]},
                    { title: 'Cargos do MOV Call', fields: [
                        { key: 'perms.monitor', label: 'Cargos Monitor', type: 'discord_role_multi' },
                        { key: 'perms.starter', label: 'Quem inicia MOV', type: 'discord_role_multi' },
                        { key: 'perms.points', label: 'Quem ajusta Pontos', type: 'discord_role_multi' },
                    ]}
                ]
            },
            pontos: {
                icon: '💎', name: 'Pontuação',
                groups: [
                    { title: 'Regras de Pontos', fields: [
                        { key: 'points.perHour', label: 'Pontos por Hora em Call', type: 'number' },
                        { key: 'points.dailyCap', label: 'Limite Diário (0 = Sem Limite)', type: 'number' },
                        { key: 'points.recruitment', label: 'Pontos por Recrutamento', type: 'number' },
                        { key: 'points.migration', label: 'Pontos por Migração', type: 'number' },
                        { key: 'points.shiftFlat', label: 'Pontos Fixos por Plantão', type: 'number' },
                        { key: 'points.shiftPerHour', label: 'Pontos por Hora de Plantão', type: 'number' },
                    ]}
                ]
            },
            movcall: {
                icon: '📢', name: 'MOV Call',
                groups: [
                    { title: 'Regras do MOV', fields: [
                        { key: 'movCall.durationMin', label: 'Duração Padrão (Minutos)', type: 'number' },
                        { key: 'movCall.minPresencePct', label: 'Presença Mínima (%)', type: 'number' },
                        { key: 'movCall.leaveGraceSec', label: 'Tolerância ao Sair (Segundos)', type: 'number' },
                        { key: 'movCall.pointsMin', label: 'Pontos Mínimos por MOV', type: 'number' },
                        { key: 'movCall.pointsMax', label: 'Pontos Máximos por MOV', type: 'number' },
                        { key: 'movCall.autoPoints', label: 'Pontos Automáticos (Sem Monitor)', type: 'number' },
                    ]},
                    { title: 'Prefixos do Chat', fields: [
                        { key: 'prefixes.start', label: 'Prefixo Iniciar MOV', type: 'text' },
                        { key: 'prefixes.lista', label: 'Prefixo Lista de MOV', type: 'text' },
                        { key: 'prefixes.cancel', label: 'Prefixo Cancelar', type: 'text' },
                    ]}
                ]
            },
            tickets: {
                icon: '🎫', name: 'Tickets',
                groups: [
                    { title: 'Sistema de Tickets', fields: [
                        { key: 'tickets.style', label: 'Layout Visual', type: 'select', options: [{v:'V1',l:'V1 Embed'},{v:'V2',l:'V2 Blocos'},{v:'V3',l:'V3 Moderno'}] },
                        { key: 'tickets.useThread', label: 'Usar Tópicos?', type: 'select', options: [{v:true,l:'Sim (Tópico)'},{v:false,l:'Não (Canal)'}] },
                        { key: 'tickets.categoryId', label: 'Categoria dos Tickets', type: 'discord_cat' },
                        { key: 'tickets.threadChannelId', label: 'Canal de Criação de Tópicos', type: 'discord_ch' },
                        { key: 'tickets.nameTemplate', label: 'Formato do Nome', type: 'text' },
                        { key: 'tickets.panel.labelStaff', label: 'Texto do Botão Staff', type: 'text' },
                        { key: 'tickets.panel.labelMig', label: 'Texto do Botão Migração', type: 'text' },
                    ]},
                    { title: 'Cargos de Tickets', fields: [
                        { key: 'tickets.accessRoleIds', label: 'Cargos com Acesso', type: 'discord_role_multi' },
                        { key: 'tickets.assignableRoleIds', label: 'Cargos Atribuíveis', type: 'discord_role_multi' },
                        { key: 'tickets.inicianteRoleIds', label: 'Cargos Iniciais', type: 'discord_role_multi' },
                    ]}
                ]
            },
            plantao: {
                icon: '🕐', name: 'Plantão',
                groups: [
                    { title: 'Configurações de Plantão', fields: [
                        { key: 'shift.enabled', label: 'Sistema Ativado?', type: 'select', options: [{v:true,l:'Sim'},{v:false,l:'Não'}] },
                        { key: 'shift.plannedMinutes', label: 'Duração do Plantão (Min)', type: 'number' },
                        { key: 'shift.minMinutes', label: 'Tempo Mínimo (Min)', type: 'number' },
                        { key: 'shift.returnMinutes', label: 'Tolerância para Voltar (Min)', type: 'number' },
                        { key: 'shift.categoryId', label: 'ID da Categoria de Calls', type: 'text' },
                        { key: 'shift.rules', label: 'Regras do Plantão', type: 'textarea' },
                    ]}
                ]
            },
            bateponto: {
                icon: '⏱️', name: 'Bate-Ponto',
                groups: [
                    { title: 'Regras do Bate-Ponto', fields: [
                        { key: 'bp_enabled', label: 'Sistema Ativado?', type: 'select', options: [{v:true,l:'Sim'},{v:false,l:'Não'}] },
                        { key: 'bp_goal', label: 'Meta de Mensagens', type: 'number' },
                        { key: 'bp_channel_id', label: 'Canal de Contagem', type: 'discord_ch' },
                        { key: 'bp_duration_min', label: 'Duração (Minutos)', type: 'number' },
                        { key: 'bp_reward', label: 'Recompensa (Pontos)', type: 'number' },
                    ]}
                ]
            },
            status: {
                icon: '🔊', name: 'Voz e Status',
                groups: [
                    { title: 'Presença do Bot', fields: [
                        { key: 'bot_status', label: 'Status no Discord', type: 'select', options: [{v:'online',l:'🟢 Online'},{v:'idle',l:'🌙 Ausente'},{v:'dnd',l:'⛔ Não Perturbe'},{v:'invisible',l:'⚫ Invisível'}] },
                        { key: 'voice.main', label: 'Canal de Voz Principal', type: 'discord_vc' },
                        { key: 'voice.internal', label: 'Canal de Voz Interno', type: 'discord_vc' },
                    ]}
                ]
            }
        };

        const getVal = (obj, path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
        
        function setVal(obj, path, value) {
            const keys = path.split('.');
            let curr = obj;
            for (let i = 0; i < keys.length - 1; i++) {
                if (!curr[keys[i]]) curr[keys[i]] = {};
                curr = curr[keys[i]];
            }
            curr[keys[keys.length - 1]] = value;
        }

        // 1. Constrói o HTML baseado no SCHEMA
        function construirPainel() {
            const sidebar = document.getElementById('sidebar');
            const form = document.getElementById('mainForm');
            sidebar.innerHTML = '';
            form.innerHTML = '';

            for (const [tabId, tabData] of Object.entries(SCHEMA)) {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${tabId === 'identidade' ? 'active' : ''}`;
                btn.innerHTML = `${tabData.icon} ${tabData.name}`;
                btn.onclick = () => mudarAba(tabId);
                sidebar.appendChild(btn);

                const tabDiv = document.createElement('div');
                tabDiv.id = `tab-${tabId}`;
                tabDiv.className = `tab-content ${tabId === 'identidade' ? 'active' : ''}`;
                tabDiv.innerHTML = `<h2>${tabData.name}</h2>`;

                tabData.groups.forEach(group => {
                    tabDiv.innerHTML += `<h3>${group.title}</h3><div class="grid" id="grid-${tabId}-${group.title.replace(/\s/g, '')}"></div>`;
                    const grid = tabDiv.querySelector(`#grid-${tabId}-${group.title.replace(/\s/g, '')}`);

                    group.fields.forEach(field => {
                        const wrapper = document.createElement('div');
                        wrapper.className = ['textarea', 'text', 'discord_ch', 'discord_cat', 'discord_vc'].includes(field.type) ? 'full' : '';
                        
                        let inputHtml = `<label>${field.label}</label>`;
                        const fieldId = field.key.replace(/\./g, '_');
                        
                        if (field.type === 'text') inputHtml += `<input type="text" id="${fieldId}" data-key="${field.key}" placeholder="Digite...">`;
                        else if (field.type === 'number') inputHtml += `<input type="number" id="${fieldId}" data-key="${field.key}">`;
                        else if (field.type === 'color') inputHtml += `<input type="color" id="${fieldId}" data-key="${field.key}">`;
                        else if (field.type === 'textarea') inputHtml += `<textarea id="${fieldId}" data-key="${field.key}"></textarea>`;
                        else if (field.type === 'select') {
                            inputHtml += `<select id="${fieldId}" data-key="${field.key}">`;
                            field.options.forEach(o => inputHtml += `<option value="${o.v}">${o.l}</option>`);
                            inputHtml += `</select>`;
                        }
                        else if (field.type.startsWith('discord_')) {
                            const isMulti = field.type.includes('multi');
                            const typeMap = { discord_ch: 'ch', discord_ch_multi: 'ch', discord_cat: 'cat', discord_cat_multi: 'cat', discord_vc: 'vc', discord_vc_multi: 'vc', discord_role_multi: 'role' };
                            const dataType = typeMap[field.type];
                            inputHtml += `<select id="${fieldId}" data-key="${field.key}" class="discord-data" data-type="${dataType}" ${isMulti ? 'multiple' : ''}></select>`;
                        }

                        wrapper.innerHTML = inputHtml;
                        grid.appendChild(wrapper);
                    });
                });
                form.appendChild(tabDiv);
            }
        }

        // 2. Carrega os dados do banco e preenche
        async function carregarDados() {
            const res = await fetch('/api/config');
            globalConfig = await res.json();
            
            discordData = await fetch('/api/discord-data').then(r => r.json());

            document.querySelectorAll('.discord-data').forEach(sel => {
                const type = sel.dataset.type;
                const list = discordData[type] || [];
                sel.innerHTML = list.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
            });

            document.querySelectorAll('[data-key]').forEach(input => {
                const key = input.dataset.key;
                let val = getVal(globalConfig, key);
                
                if (val === undefined || val === null) {
                    // Tenta pegar valores padrão se não existirem
                    if (input.type === 'checkbox') val = false;
                    else if (input.tagName === 'SELECT') val = '';
                    else return;
                }

                if (input.multiple && Array.isArray(val)) {
                    Array.from(input.options).forEach(opt => opt.selected = val.includes(opt.value));
                } else if (input.type === 'checkbox') {
                    input.checked = Boolean(val);
                } else {
                    input.value = val;
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainForm').style.display = 'block';
            document.getElementById('saveBar').style.display = 'flex';
        }

        // 3. Salva tudo
        async function salvarTudo(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-save');
            btn.innerText = 'Salvando...';

            const updatedData = JSON.parse(JSON.stringify(globalConfig));

            const multiSelects = {};
            document.querySelectorAll('select[multiple]').forEach(sel => {
                const key = sel.dataset.key;
                multiSelects[key] = Array.from(sel.selectedOptions).map(o => o.value);
            });

            document.querySelectorAll('[data-key]').forEach(input => {
                const key = input.dataset.key;
                let val;

                if (input.multiple) {
                    val = multiSelects[key];
                } else {
                    val = input.value;
                    if (input.type === 'number') val = Number(val);
                    if (val === 'true') val = true;
                    if (val === 'false') val = false;
                }
                
                setVal(updatedData, key, val);
            });

            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedData)
            });

            if (res.ok) {
                globalConfig = updatedData;
                btn.innerText = 'Salvo com Sucesso!';
                btn.style.background = '#2ecc71';
                setTimeout(() => { btn.innerText = 'Salvar Tudo'; btn.style.background = '#8A4FFF'; }, 2000);
            }
        }

        function mudarAba(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            event.target.classList.add('active');
        }

        construirPainel();
        carregarDados();
    </script>
</body>
</html>
