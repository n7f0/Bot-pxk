<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PXK - Painel de Controle Total</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --bg-dark: #1c202c;
            --card-bg: #31323e;
            --purple: #60519b;
            --purple-hover: #7160b5;
            --text-main: #bfc0d1;
            --text-muted: #8a8b9e;
            --border: rgba(255,255,255,0.05);
            --input-bg: rgba(0,0,0,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); color: var(--text-main); height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden; 
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: 
                linear-gradient(to bottom, rgba(28, 32, 44, 0.8), rgba(28, 32, 44, 0.95)),
                url('/fundo.png');
            background-size: cover; background-position: center; z-index: -1; pointer-events: none;
        }
        
        /* HEADER */
        .header { 
            padding: 16px 40px; background: rgba(28, 32, 44, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; z-index: 100; 
        }
        .header .brand { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 24px; color: #fff; letter-spacing: 1px; }

        /* USER MENU */
        .user-menu-container { position: relative; margin-left: auto; }
        .user-info { 
            display: flex; align-items: center; gap: 10px; cursor: pointer; 
            background: var(--card-bg); padding: 8px 16px; border-radius: 99px; 
            border: 1px solid var(--border); transition: 0.2s; 
        }
        .user-info:hover { background: rgba(255,255,255,0.05); }
        .user-info img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--purple); }
        .user-info span { font-size: 14px; font-weight: 600; color: #fff; }
        .user-dropdown { 
            display: none; position: absolute; top: calc(100% + 10px); right: 0; 
            background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; z-index: 100; min-width: 180px;
        }
        .user-dropdown.active { display: block; }
        .logout-btn { display: block; padding: 14px 20px; color: #f87171; text-decoration: none; font-weight: 700; font-size: 14px; transition: 0.2s; }
        .logout-btn:hover { background: rgba(248,113,113,0.1); }

        /* CONTAINER */
        .container { display: flex; flex: 1; padding: 24px; gap: 24px; max-width: 1600px; margin: 0 auto; width: 100%; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { 
            width: 290px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; 
            padding: 20px; overflow-y: auto; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .nav-btn { 
            display: block; width: 100%; padding: 10px 16px; margin-bottom: 4px; background: transparent; 
            color: var(--text-muted); border: 1px solid transparent; border-radius: 10px; text-align: left; 
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; 
        }
        .nav-btn:hover { background: rgba(255,255,255,0.03); color: #fff; }
        .nav-btn.active { background: var(--purple); color: #fff; border-color: var(--purple-hover); }
        
        /* CONTENT */
        .content { 
            flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; 
            padding: 40px; overflow-y: auto; scroll-behavior: smooth; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        
        /* FORM E INPUTS */
        h2 { font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; color: #fff; letter-spacing: -0.5px; }
        h3 { font-size: 12px; color: var(--purple-hover); margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .full { grid-column: 1 / -1; }
        label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        input, select, textarea { 
            width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--border); 
            border-radius: 10px; color: #fff; font-size: 13px; outline: none; transition: 0.2s; 
        }
        input:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(96,81,155,0.2); }
        textarea { resize: vertical; min-height: 80px; }
        .tutorial { background: rgba(96,81,155,0.1); border-left: 3px solid var(--purple); padding: 12px 16px; border-radius: 6px; font-size: 12px; color: var(--text-main); margin-top: 8px; display: flex; gap: 10px; line-height: 1.5; }
        
        /* CUSTOM MULTI-SELECT (Checkboxes) */
        .custom-ms { position: relative; user-select: none; }
        .ms-header { 
            background: var(--input-bg); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted);
        }
        .ms-header:hover { border-color: var(--purple); }
        .ms-dropdown { 
            display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); 
            border: 1px solid var(--border); border-radius: 10px; margin-top: 5px; max-height: 200px; 
            overflow-y: auto; z-index: 50; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .custom-ms.open .ms-dropdown { display: block; }
        .ms-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .ms-item:hover { background: rgba(255,255,255,0.05); }
        .ms-item input[type="checkbox"] { width: auto; accent-color: var(--purple); cursor: pointer; }

        /* CUSTOM COLOR PICKER */
        .color-picker-wrapper {
            display: flex; align-items: center; gap: 12px;
            background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 16px; transition: 0.2s;
        }
        .color-picker-wrapper:hover { border-color: var(--purple); }
        .color-picker-wrapper input[type="color"] {
            width: 32px; height: 32px; padding: 0; border: 2px solid rgba(255,255,255,0.2); 
            background: none; border-radius: 50%; cursor: pointer; overflow: hidden;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        .color-picker-wrapper span { font-family: monospace; font-size: 13px; color: #fff; }
        
        /* SAVE BAR */
        .save-bar { 
            display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); 
            background: rgba(28, 32, 44, 0.95); backdrop-filter: blur(10px); padding: 12px 24px; 
            border-radius: 99px; border: 1px solid var(--purple); gap: 20px; 
            align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); z-index: 100; animation: slideUp 0.3s;
            width: max-content; max-width: 90vw;
        }
        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 24px; opacity: 1; } }
        .btn-save { 
            background: var(--purple); color: #fff; border: none; padding: 12px 32px; 
            border-radius: 99px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; 
        }
        .btn-save:hover { background: var(--purple-hover); transform: scale(1.05); }
        .loading { text-align: center; color: var(--purple-hover); font-weight: bold; margin-top: 50px; font-size: 18px; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; }

        /* MOBILE */
        @media(max-width: 900px) {
            body { overflow: auto; height: auto; min-height: 100vh; }
            .header { padding: 16px 20px; }
            .container { flex-direction: column; overflow: visible; padding: 16px; gap: 16px; }
            .sidebar { width: 100%; flex-shrink: 1; max-height: 250px; }
            .content { width: 100%; padding: 20px; overflow: visible; }
            .grid { grid-template-columns: 1fr; }
            .save-bar { padding: 10px 16px; flex-direction: column; border-radius: 16px; gap: 10px; }
            .btn-save { width: 100%; padding: 10px; }
        }
        /* PXK dashboard refresh — clean glass, hierarchy and motion */
        :root {
            --bg-dark: #0b1020;
            --card-bg: rgba(19, 26, 45, 0.88);
            --purple: #7866d8;
            --purple-hover: #9585f3;
            --text-main: #e7e9f5;
            --text-muted: #9aa4bd;
            --border: rgba(169, 180, 220, 0.14);
            --input-bg: rgba(5, 10, 24, 0.58);
            --surface: rgba(255,255,255,0.035);
            --shadow: 0 24px 70px rgba(0,0,0,.34);
        }
        body { background: #0b1020; color: var(--text-main); }
        body::before {
            background-image:
                radial-gradient(ellipse at 12% 5%, rgba(120,102,216,.22), transparent 42%),
                radial-gradient(ellipse at 88% 85%, rgba(48,120,180,.13), transparent 38%),
                linear-gradient(135deg, rgba(8,13,28,.95), rgba(13,19,37,.96)),
                url('/fundo.png');
            background-size: cover; background-position: center; opacity: 1;
        }
        .header {
            min-height: 78px; padding: 14px clamp(18px, 4vw, 54px);
            background: rgba(9, 14, 29, .76); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .brand-wrap { display:flex; align-items:center; gap:13px; }
        .brand-mark {
            width:42px; height:42px; display:grid; place-items:center; border-radius:14px;
            color:#fff; background:linear-gradient(145deg,#8a79ef,#5144aa);
            box-shadow:0 8px 24px rgba(105,88,210,.38), inset 0 1px 0 rgba(255,255,255,.24);
        }
        .brand-mark svg { width:23px; height:23px; }
        .brand-copy { display:flex; flex-direction:column; gap:1px; }
        .brand-copy .brand { font-size:21px; line-height:1; letter-spacing:1.8px; }
        .brand-copy small { color:#929bb4; font-size:9px; letter-spacing:2.1px; font-weight:800; }
        .user-info { border-radius:15px; background:rgba(255,255,255,.045); padding:8px 13px; transition:transform .22s ease,background .22s ease,border-color .22s ease; }
        .user-info:hover { transform:translateY(-2px); background:rgba(255,255,255,.085); border-color:rgba(149,133,243,.4); }
        .user-info img { border-color:#8372e5; }
        .user-dropdown { background:#141c32; border-color:var(--border); box-shadow:var(--shadow); }
        .container { max-width:1760px; padding:clamp(14px,2.3vw,32px); gap:22px; }
        .sidebar, .content {
            background:linear-gradient(155deg,rgba(24,33,57,.92),rgba(15,22,41,.94));
            border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow);
            backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
        }
        .sidebar { width:276px; padding:18px 14px; }
        .sidebar-caption { padding:10px 13px 13px; color:#7f8ba9; font-size:10px; font-weight:900; letter-spacing:1.8px; }
        .sidebar-caption span { display:inline-block; width:6px; height:6px; margin:0 8px 1px 0; border-radius:50%; background:#8d7cf0; box-shadow:0 0 12px #8d7cf0; }
        .nav-btn {
            position:relative; display:flex; align-items:center; gap:12px; min-height:46px;
            padding:10px 12px; margin-bottom:5px; border-radius:13px; color:#aab3ca;
            font-size:13px; font-weight:650; transition:background .2s ease,color .2s ease,transform .2s ease,border-color .2s ease;
        }
        .nav-btn:hover { background:rgba(255,255,255,.055); color:#fff; transform:translateX(3px); }
        .nav-btn.active {
            color:#fff; border-color:rgba(160,145,255,.28);
            background:linear-gradient(100deg,rgba(120,102,216,.30),rgba(120,102,216,.08));
            box-shadow:inset 3px 0 0 #9a8cff,0 8px 22px rgba(0,0,0,.12);
        }
        .nav-icon { display:grid; place-items:center; flex:0 0 30px; width:30px; height:30px; border-radius:10px; background:rgba(255,255,255,.055); font-size:16px; }
        .nav-label { flex:1; }
        .nav-chevron { width:14px; height:14px; opacity:0; transform:translateX(-4px); transition:all .2s ease; }
        .nav-btn.active .nav-chevron, .nav-btn:hover .nav-chevron { opacity:.75; transform:translateX(0); }
        .content { padding:clamp(20px,3.4vw,46px); position:relative; }
        .content::before { content:''; position:absolute; left:30px; right:30px; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(174,160,255,.34),transparent); }
        .tab-content { animation:panelEnter .32s cubic-bezier(.2,.8,.2,1); }
        @keyframes panelEnter { from { opacity:0; transform:translateY(9px) scale(.995); } to { opacity:1; transform:translateY(0) scale(1); } }
        h2 { font-size:clamp(21px,2vw,27px); letter-spacing:-.8px; text-transform:none; margin-bottom:24px; }
        h2::after { content:''; display:block; width:48px; height:3px; margin-top:12px; border-radius:9px; background:linear-gradient(90deg,#9585f3,transparent); }
        h3 { color:#a99aff; font-size:11px; letter-spacing:1.4px; margin-top:30px; }
        .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; }
        .grid > div { min-width:0; padding:15px; border:1px solid rgba(169,180,220,.09); border-radius:15px; background:rgba(255,255,255,.025); transition:border-color .2s ease,background .2s ease,transform .2s ease; }
        .grid > div:hover { border-color:rgba(149,133,243,.24); background:rgba(255,255,255,.04); }
        label { color:#aab4ce; letter-spacing:.45px; }
        input, select, textarea { background:var(--input-bg); border-color:rgba(169,180,220,.15); border-radius:11px; min-height:43px; }
        input:hover, select:hover, textarea:hover { border-color:rgba(149,133,243,.42); }
        input:focus, select:focus, textarea:focus { border-color:#8d7cf0; box-shadow:0 0 0 3px rgba(120,102,216,.16); }
        .tutorial { background:rgba(120,102,216,.09); border-left-color:#8776e8; border-radius:9px; }
        .ms-header { border-color:rgba(169,180,220,.15); border-radius:11px; }
        .ms-dropdown { background:#141d34; border-color:var(--border); border-radius:13px; }
        .ms-item { text-transform:none; font-weight:500; letter-spacing:0; color:#d7dcef; }
        .ms-item:hover { background:rgba(120,102,216,.12); }
        .color-picker-wrapper { border-color:rgba(169,180,220,.15); border-radius:11px; }
        .save-bar { background:rgba(13,19,37,.94); border-color:rgba(149,133,243,.5); box-shadow:0 18px 55px rgba(0,0,0,.55); backdrop-filter:blur(20px); }
        .btn-save { background:linear-gradient(135deg,#8170e6,#5b4bc0); box-shadow:0 7px 20px rgba(102,85,205,.3); }
        .btn-save:hover { background:linear-gradient(135deg,#9a8af2,#6c5bd0); transform:translateY(-2px); }
        .loading { display:flex; justify-content:center; align-items:center; gap:12px; color:#c0b7ff; }
        .loading::before { content:''; width:18px; height:18px; border:2px solid rgba(149,133,243,.25); border-top-color:#a99aff; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        button, a, input, select, textarea { -webkit-tap-highlight-color:transparent; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #aa9eff; outline-offset:3px; }
        ::-webkit-scrollbar-thumb { background:linear-gradient(#9a8af2,#5c4fba); }
        @media(max-width:1100px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .sidebar { width:240px; } }
        @media(max-width:900px) {
            body { overflow:auto; height:auto; min-height:100vh; }
            .header { min-height:68px; padding:12px 16px; }
            .container { flex-direction:column; overflow:visible; padding:13px; gap:13px; }
            .sidebar { width:100%; max-height:none; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; }
            .sidebar-caption { grid-column:1/-1; padding-bottom:6px; }
            .nav-btn { margin:0; min-height:44px; }
            .nav-chevron { display:none; }
            .content { width:100%; padding:22px 17px; overflow:visible; }
            .grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .save-bar { padding:11px 14px; flex-direction:row; border-radius:16px; gap:10px; bottom:12px; }
            .btn-save { width:auto; padding:11px 17px; }
        }
        @media(max-width:560px) {
            .brand-mark { width:37px; height:37px; border-radius:12px; }
            .brand-copy .brand { font-size:19px; }
            .brand-copy small { font-size:8px; }
            .user-info { padding:7px 9px; gap:7px; }
            .user-info span { max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
            .sidebar { grid-template-columns:1fr 1fr; padding:12px; }
            .nav-btn { gap:8px; padding:8px; font-size:12px; }
            .nav-icon { flex-basis:27px; width:27px; height:27px; font-size:14px; }
            .grid { grid-template-columns:1fr; }
            .save-bar { width:calc(100% - 24px); max-width:none; justify-content:space-between; }
            .save-bar span { font-size:11px !important; }
        }
        @media(prefers-reduced-motion:reduce) {
            *, *::before, *::after { scroll-behavior:auto !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand-wrap">
            <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9L12 2.8Z"/><path d="m8.5 14.8 3.5-7.2 3.5 7.2M9.8 12.5h4.4"/></svg></div>
            <div class="brand-copy"><div class="brand">PXK</div><small>CONTROL CENTER</small></div>
        </div>
        
        <div class="user-menu-container">
            <div class="user-info" onclick="toggleUserMenu(event)">
                <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                <span id="user-name">Carregando...</span>
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="color: var(--text-muted);"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="user-dropdown" id="user-dropdown">
                <a href="/logout" class="logout-btn">🚪 Sair da Conta</a>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content">
            <div id="loading" class="loading">⏳ Carregando configurações...</div>
            <form id="mainForm" onsubmit="salvarTudo(event)" style="display: none;"></form>
        </main>
    </div>

    <div class="save-bar" id="saveBar">
        <span style="color: var(--text-muted); font-size: 13px;">Você tem alterações não salvas.</span>
        <button type="submit" form="mainForm" class="btn-save">Salvar Tudo</button>
    </div>

    <script>
        let globalConfig = {};
        let discordData = { ch: [], vc: [], cat: [], role: [] };
        let csrfToken = null;

        async function loadUser() {
            try {
                const res = await fetch('/api/me');
                if (!res.ok) {
                    if (res.status === 401) window.location.replace('/login');
                    throw new Error('Sua sessão expirou. Entre novamente.');
                }
                const user = await res.json();
                csrfToken = user.csrfToken || null;
                if (user && user.username) {
                    document.getElementById('user-name').innerText = user.username;
                    const avatarUrl = user.avatar 
                        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` 
                        : `https://cdn.discordapp.com/embed/avatars/0.png`;
                    document.getElementById('user-avatar').src = avatarUrl;
                } else {
                    document.getElementById('user-name').innerText = 'Administrador';
                }
            } catch (e) {
                document.getElementById('user-name').innerText = 'Sessão expirada';
            }
        }

        function toggleUserMenu(e) {
            e.stopPropagation();
            document.getElementById('user-dropdown').classList.toggle('active');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.user-menu-container')) {
                document.getElementById('user-dropdown').classList.remove('active');
            }
            if (!event.target.closest('.custom-ms')) {
                document.querySelectorAll('.custom-ms').forEach(ms => ms.classList.remove('open'));
            }
        }

        document.getElementById('mainForm').addEventListener('input', () => {
            document.getElementById('saveBar').style.display = 'flex';
        });
        document.getElementById('mainForm').addEventListener('change', () => {
            document.getElementById('saveBar').style.display = 'flex';
        });

        const SCHEMA = {
            identidade: {
                icon: '🎨', name: 'Identidade Visual',
                groups: [
                    { title: 'Painel de Tickets', fields: [
                        { key: 'tickets.panel.title', label: 'Título', type: 'text' },
                        { key: 'tickets.panel.desc1', label: 'Descrição 1', type: 'textarea' },
                        { key: 'tickets.panel.desc2', label: 'Descrição 2 (V2)', type: 'textarea' },
                        { key: 'tickets.panel.desc3', label: 'Descrição 3 (V2)', type: 'textarea' },
                        { key: 'tickets.panel.desc4', label: 'Descrição 4 (V2)', type: 'textarea' },
                        { key: 'tickets.panel.color', label: 'Cor (Hex)', type: 'color' },
                        { key: 'tickets.panel.banner', label: 'URL do Banner', type: 'text' },
                        { key: 'tickets.panel.thumbnail', label: 'URL da Miniatura', type: 'text' },

        const getVal = (obj, path) => path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
        
        function setVal(obj, path, value) {
            const keys = path.split('.');
            let curr = obj;
            for (let i = 0; i < keys.length - 1; i++) {
                const key = keys[i];
                const nextKey = keys[i + 1];
                if (!curr[key]) {
                    curr[key] = /^\d+$/.test(nextKey) ? [] : {};
                }
                curr = curr[key];
            }
            curr[keys[keys.length - 1]] = value;
        }

        function construirPainel() {
            const sidebar = document.getElementById('sidebar');
            const form = document.getElementById('mainForm');
            sidebar.innerHTML = '';
            form.innerHTML = '';
            let isFirst = true;
            const caption = document.createElement('div');
            caption.className = 'sidebar-caption';
            caption.innerHTML = '<span></span>NAVEGAÇÃO';
            sidebar.appendChild(caption);

            for (const [tabId, tabData] of Object.entries(SCHEMA)) {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${isFirst ? 'active' : ''}`;
                btn.innerHTML = `<span class="nav-icon">${tabData.icon}</span><span class="nav-label">${tabData.name}</span><svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;
                btn.onclick = (e) => mudarAba(tabId, e.target);
                sidebar.appendChild(btn);

                const tabDiv = document.createElement('div');
                tabDiv.id = `tab-${tabId}`;
                tabDiv.className = `tab-content ${isFirst ? 'active' : ''}`;
                tabDiv.innerHTML = `<h2>${tabData.name}</h2>`;
                isFirst = false;

                tabData.groups.forEach(group => {
                    const h3 = document.createElement('h3');
                    h3.innerText = group.title;
                    tabDiv.appendChild(h3);

                    const grid = document.createElement('div');
                    grid.className = 'grid';
                    tabDiv.appendChild(grid);

                    group.fields.forEach(field => {
                        const wrapper = document.createElement('div');
                        wrapper.className = ['textarea', 'text', 'discord_ch', 'discord_cat', 'discord_vc', 'color'].includes(field.type) ? 'full' : '';
                        
                        let inputHtml = `<label>${field.label}</label>`;
                        const fieldId = field.key.replace(/\./g, '_');
                        
                        if (field.type === 'text') {
                            inputHtml += `<input type="text" id="${fieldId}" data-key="${field.key}" placeholder="Digite...">`;
                        } else if (field.type === 'number') {
                            inputHtml += `<input type="number" id="${fieldId}" data-key="${field.key}">`;
                        } else if (field.type === 'color') {
                            inputHtml += `<div class="color-picker-wrapper"><input type="color" id="${fieldId}" data-key="${field.key}"><span id="${fieldId}_text"></span></div>`;
                        } else if (field.type === 'textarea') {
                            inputHtml += `<textarea id="${fieldId}" data-key="${field.key}"></textarea>`;
                        } else if (field.type === 'select') {
                            inputHtml += `<select id="${fieldId}" data-key="${field.key}">`;
                            field.options.forEach(o => inputHtml += `<option value="${o.v}">${o.l}</option>`);
                            inputHtml += `</select>`;
                        } else if (field.type.startsWith('discord_')) {
                            const isMulti = field.type.includes('multi');
                            const typeMap = { discord_ch: 'ch', discord_ch_multi: 'ch', discord_cat: 'cat', discord_cat_multi: 'cat', discord_vc: 'vc', discord_vc_multi: 'vc', discord_role_multi: 'role' };
                            const dataType = typeMap[field.type];
                            
                            if (isMulti) {
                                inputHtml += `
                                <div class="custom-ms" id="${fieldId}_container">
                                    <div class="ms-header" onclick="toggleMS('${fieldId}')">
                                        <span id="${fieldId}_label">Selecione...</span>
                                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                                    </div>
                                    <div class="ms-dropdown" id="${fieldId}_dropdown"></div>
                                    <input type="hidden" id="${fieldId}" data-key="${field.key}" data-type="${dataType}" data-multi="true">
                                </div>`;
                            } else {
                                inputHtml += `<select id="${fieldId}" data-key="${field.key}" class="discord-data" data-type="${dataType}"></select>`;
                            }
                        }

                        if(field.help) inputHtml += `<div class="tutorial">💡 ${field.help}</div>`;

                        wrapper.innerHTML = inputHtml;
                        grid.appendChild(wrapper);
                    });
                });
                form.appendChild(tabDiv);
            }
        }

        function toggleMS(id) {
            const el = document.getElementById(`${id}_container`);
            document.querySelectorAll('.custom-ms').forEach(ms => { if(ms !== el) ms.classList.remove('open'); });
            el.classList.toggle('open');
        }

        async function carregarDados() {
            try {
                const res = await fetch('/api/config');
                if (!res.ok) throw new Error('Falha ao buscar configurações');
                globalConfig = await res.json() || {};

                const ddRes = await fetch('/api/discord-data');
                if (!ddRes.ok) throw new Error('Falha ao buscar dados do Discord');
                discordData = await ddRes.json() || { ch: [], vc: [], cat: [], role: [] };

                document.querySelectorAll('.discord-data').forEach(sel => {
                    const type = sel.dataset.type;
                    const list = discordData[type] || [];
                    sel.replaceChildren();
                    const emptyOption = document.createElement('option');
                    emptyOption.value = '';
                    emptyOption.textContent = '— nenhum —';
                    sel.appendChild(emptyOption);
                    list.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.name;
                        sel.appendChild(option);
                    });
                });

                document.querySelectorAll('[data-multi="true"]').forEach(input => {
                    const key = input.dataset.key;
                    const fieldId = key.replace(/\./g, '_');
                    const type = input.dataset.type;
                    const list = discordData[type] || [];
                    const dropdown = document.getElementById(`${fieldId}_dropdown`);
                    const selected = getVal(globalConfig, key);
                    const selectedValues = Array.isArray(selected) ? selected : [];
                    dropdown.replaceChildren();
                    list.forEach(item => {
                        const label = document.createElement('label');
                        label.className = 'ms-item';
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.value = item.id;
                        checkbox.checked = selectedValues.includes(item.id);
                        checkbox.addEventListener('change', () => updateMSLabel(fieldId));
                        label.appendChild(checkbox);
                        label.appendChild(document.createTextNode(item.name));
                        dropdown.appendChild(label);
                    });
                    updateMSLabel(fieldId);
                });

                document.querySelectorAll('[data-key]').forEach(input => {
                    if (input.type === 'hidden') return; 
                    const key = input.dataset.key;
                    let val = getVal(globalConfig, key);
                    
                    if (val === undefined || val === null) {
                        if (input.tagName === 'SELECT') val = '';
                        else return;
                    }

                    if (input.type === 'color') {
                        input.value = val || '#000000';
                        document.getElementById(input.id + '_text').innerText = input.value;
                        input.addEventListener('input', (e) => { document.getElementById(input.id + '_text').innerText = e.target.value; });
                    } else {
                        input.value = val;
                    }
                });

                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainForm').style.display = 'block';
            } catch (e) {
                console.error(e);
                document.getElementById('loading').innerHTML = `<div class="error-box"><h3>Erro ao Carregar</h3><p>${e.message}</p></div>`;
            }
        }

        function updateMSLabel(fieldId) {
            const container = document.getElementById(`${fieldId}_dropdown`);
            const checked = container.querySelectorAll('input[type="checkbox"]:checked');
            const label = document.getElementById(`${fieldId}_label`);
            if (checked.length === 0) {
                label.innerText = 'Selecione...';
            } else if (checked.length === 1) {
                label.innerText = checked[0].parentElement.innerText.trim();
            } else {
                label.innerText = `${checked.length} itens selecionados`;
            }
        }

        async function salvarTudo(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-save');
            btn.innerText = 'Salvando...';

            const updatedData = JSON.parse(JSON.stringify(globalConfig));

            document.querySelectorAll('[data-multi="true"]').forEach(input => {
                const key = input.dataset.key;
                const fieldId = key.replace(/\./g, '_');
                const checked = document.getElementById(`${fieldId}_dropdown`).querySelectorAll('input[type="checkbox"]:checked');
                const values = Array.from(checked).map(c => c.value);
                setVal(updatedData, key, values);
            });

            document.querySelectorAll('[data-key]').forEach(input => {
                if (input.dataset.multi) return;
                const key = input.dataset.key;
                let val = input.value;
                if (input.type === 'number') val = Number(val);
                if (val === 'true') val = true;
                if (val === 'false') val = false;
                setVal(updatedData, key, val);
            });

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken || '' },
                    body: JSON.stringify(updatedData)
                });

                if (res.ok) {
                    globalConfig = updatedData;
                    btn.innerText = 'Salvo!';
                    btn.style.background = '#2ecc71';
                    document.getElementById('saveBar').style.display = 'none'; 
                    setTimeout(() => { btn.innerText = 'Salvar Tudo'; btn.style.background = 'var(--purple)'; }, 2000);
                } else {
                    const payload = await res.json().catch(() => ({}));
                    if (res.status === 401) window.location.replace('/login');
                    if (res.status === 403) throw new Error(payload.error || 'Sessão de segurança expirada. Atualize a página.');
                    throw new Error(payload.error || 'Erro no servidor ao salvar.');
                }
            } catch (e) {
                alert('Erro ao salvar: ' + e.message);
                btn.innerText = 'Salvar Tudo';
            }
        }

        function mudarAba(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            btn.classList.add('active');
        }

        (async function bootPanel() {
            try {
                await loadUser();
                if (!csrfToken) return;
                construirPainel();
                await carregarDados();
            } catch (e) {
                const loading = document.getElementById('loading');
                loading.textContent = 'Erro ao iniciar o painel: ' + (e.message || 'tente novamente.');
            }
        })();
    </script>
</body>
</html>
